apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hpc-mail-objects
  namespace: hpc-mail
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hpc-mail-http01
  namespace: hpc-mail
spec:
  acme:
    email: fuergaosi@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: hpc-mail-acme-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx-aliyun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpc-mail
  namespace: hpc-mail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hpc-mail}
  template:
    metadata:
      labels: {app: hpc-mail}
    spec:
      nodeSelector:
        kubernetes.io/hostname: pve-bigbox-ubuntu-3
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mail
          image: docker.io/library/hpc-mail:k3s-pg-20261028-v6
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: hpc-mail}
          env:
            - {name: BUILD_SHA, value: k3s-pg-20261028-v6}
            - {name: SITE_ORIGIN, value: 'https://mail.multi-agent.wiki'}
            - {name: SMTP_HOSTNAME, value: mx.multi-agent.wiki}
            - {name: MAIL_DOMAINS, value: 'multi-agent.wiki,0xolivia.xyz,astergate.cc,seed-diffusion.com'}
          ports:
            - {name: http, containerPort: 8080}
            - {name: smtp, containerPort: 2525}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - {name: objects, mountPath: /data}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: objects
          persistentVolumeClaim: {claimName: hpc-mail-objects}
        - name: tls
          secret: {secretName: hpc-mail-tls, optional: true}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hpc-mail
  namespace: hpc-mail
spec:
  selector: {app: hpc-mail}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: smtp, port: 2525, targetPort: smtp}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hpc-mail
  namespace: hpc-mail
  annotations:
    cert-manager.io/issuer: hpc-mail-http01
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 40m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '75'
spec:
  ingressClassName: nginx-aliyun
  tls:
    - hosts: [mail.multi-agent.wiki, mx.multi-agent.wiki]
      secretName: hpc-mail-tls
  rules:
    - host: mail.multi-agent.wiki
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: hpc-mail, port: {name: http}}
    - host: mx.multi-agent.wiki
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service: {name: hpc-mail, port: {name: http}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpc-mail-smtp
  namespace: hpc-mail
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn 100
      nbthread 1
    defaults
      log global
      mode tcp
      timeout connect 5s
      timeout client 90s
      timeout server 90s
    frontend smtp
      bind :2525
      default_backend mail
    backend mail
      server application hpc-mail.hpc-mail.svc.cluster.local.:2525 check resolve-prefer ipv4
    listen local-stats
      bind 127.0.0.1:8404
      mode http
      stats enable
      stats uri /
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpc-mail-smtp
  namespace: hpc-mail
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: hpc-mail-smtp}
  template:
    metadata:
      labels: {app: hpc-mail-smtp}
    spec:
      nodeSelector:
        kubernetes.io/hostname: tencent-master
      tolerations:
        - {key: dedicated, operator: Equal, value: master, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: smtp
          image: haproxy:3.2-alpine
          ports:
            - {name: smtp, containerPort: 2525, hostPort: 25, protocol: TCP}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /usr/local/etc/haproxy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: hpc-mail-smtp}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hpc-mail
  namespace: hpc-mail
spec:
  podSelector: {matchLabels: {app: hpc-mail}}
  policyTypes: [Ingress]
  ingress:
    # The HTTP service is public through the existing ingress; application
    # authentication protects every private endpoint independently of source IP.
    - ports: [{port: 8080, protocol: TCP}]
    - from:
        - podSelector: {matchLabels: {app: hpc-mail-smtp}}
      ports: [{port: 2525, protocol: TCP}]
